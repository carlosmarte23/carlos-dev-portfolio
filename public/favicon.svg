<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Carlos Marte logo</title>
  <desc id="desc">CM monogram.</desc>
  <style>
    :root {
      --bg: #f8fafc;
      --text: #16a34a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --text: #22c55e;
      }
    }

    .mark {
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: 0;
    }
  </style>
  <rect width="128" height="128" rx="28" fill="var(--bg)" />
  <text class="mark" x="64" y="81" fill="var(--text)" text-anchor="middle">
    CM
  </text>
</svg>
